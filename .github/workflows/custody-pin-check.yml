# ADVISORY — deterministic verification of the pins inside custody records.
#
# NOT A REQUIRED CHECK, and this file cannot make it one. Whether a check is
# required on `main` is a repository ruleset setting, which is a Founder act;
# adding this job to that set is a separate decision from merging this file.
# Until that decision is taken, a failure here is visible and blocks nothing.
#
# WHY IT EXISTS. The records under `docs/planning/command-journal/custody/`
# cite each other by git blob id, SHA-256, byte count and line count, and one
# publishes a `sed` recipe for extracting a hash-pinned substring. All of it is
# maintained by hand and all of it fails silently — a stale pin still looks
# like a pin. The R4 brief's own landing banner says so: an edit that breaks
# the extraction yields "a wrong hash, not an error". This job turns that class
# of silent failure into a red check.
#
# It verifies the records' own declarations rather than a manifest of its own.
# A manifest would be one more hand-maintained copy to go stale, which is the
# failure being guarded against.
#
# Runs on every pull request rather than filtering on a path glob, for the same
# reason `path-audit.yml` does: a commit that moves or deletes a pinned file
# without touching the record that pins it is exactly the case a path filter
# would skip.
#
# Changes to this workflow's triggers, permissions, or steps require founder
# approval before merge (same rule class as DEC-20260718-02 clause 4). The
# hedge is deliberate and matches advisory-reviewers.yml, attribution-shape.yml
# and claude-code-review.yml: that decision record lives in FounderOS, not in
# this repository, so nothing here has read it. Stating flatly what an unread
# document says is the error this file's own gate exists to make visible.
#
# This comment restates where the rule comes from and does not create it — a
# file cannot establish an approval requirement about itself, any more than it
# can make itself a required check. Enforcement, if wanted beyond the decision
# record, belongs in the ruleset or CODEOWNERS.

name: Custody Pin Check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# One live run per pull request: a newer push cancels a check still running on
# a superseded head, matching `advisory-reviewers.yml`. The timeout is a
# backstop for a pathological record, not a performance target — the whole
# check runs in a few seconds.
concurrency:
  group: custody-pin-check-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  custody-pin-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        # Pinned to the commit `v4` resolved to on 2026-09-01 (tag v4.4.0).
        #
        # No cross-file claim here, deliberately. Two successive wordings of
        # this comment tried to assert how the other workflows pin checkout,
        # and both were wrong: the first said "the only pin" AND "identical
        # across four files", which cannot both hold; the second said "every
        # workflow carries this same SHA", but advisory-reviewers.yml has no
        # checkout step at all. A hand-maintained claim about other files,
        # living in a comment that nothing checks, is the exact failure this
        # PR's own gate exists to catch — so the claim belongs in the PR
        # record, dated and evidenced, not restated here where it drifts.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Selftest the checker against synthetic records
        # The checker is a parser over hand-written markdown. This asserts that
        # each documented failure mode actually fails — a moved format, an
        # ambiguous record, a hostile sed recipe — before the real records are
        # read, so a green result below means the parser still works rather
        # than that it stopped seeing anything.
        run: bash scripts/custody-pin-check.sh selftest

      - name: Verify declared custody pins
        run: bash scripts/custody-pin-check.sh
