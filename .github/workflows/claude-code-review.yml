# ADVISORY — Claude Code automated review of pull requests.
#
# Posts one advisory review comment on every pull request opened against, or
# pushed to, this repository. The review is scoped to two things only:
#   1. correctness of the diff against `docs/command-journal-contract.md`;
#   2. this repository's conventions (AGENTS.md, README.md, the existing
#      packages, tests, scripts, and workflows).
#
# ADVISORY ONLY — NEVER A REQUIRED CHECK. Founder ruling, recorded in the
# FounderOS decision log at v4.50: the job below MUST NOT be added to the
# `main` ruleset's required status checks (path-audit, attribution-shape,
# CodeRabbit, build-and-test at the time of writing). Its comment is input
# for the author and the Founder to weigh. It is not a Tier-2 review under
# DEC-20260814-02, not a merge authorization under DEC-20260718-04, and a
# failed or skipped run blocks nothing.
#
# Authentication, stated so nothing is inferred:
#   - ANTHROPIC_API_KEY is Founder-provisioned as a repository secret. This
#     file references it only as `secrets.ANTHROPIC_API_KEY`; the value is
#     never echoed, logged, or committed. If the secret is absent the job
#     fails and, being non-required, blocks nothing.
#   - GitHub access uses the workflow's own GITHUB_TOKEN, passed through the
#     action's `github_token` input and bounded by the `permissions` block
#     below. The action's default path instead exchanges an OIDC token for a
#     Claude GitHub App installation token, which requires that app to be
#     installed on this repository by a repository admin; supplying
#     `github_token` short-circuits that exchange (action source,
#     src/github/token.ts: OVERRIDE_GITHUB_TOKEN is returned before any OIDC
#     request), so no app installation is required for this workflow.
#     Comments therefore appear as github-actions[bot].
#
# Input names are taken from the action's `action.yml` and its
# docs/solutions.md "Automatic PR Code Review" example at
# anthropics/claude-code-action `main`, read 2026-09-01 — not from memory.
# The action is pinned to the full commit SHA that the `v1` tag resolved to
# on that date, and the checkout is the exact PR head SHA; fork and
# Dependabot pull requests are skipped because their runs receive no
# secrets; and the advisory comment is edited in place on later pushes
# (`gh pr comment --edit-last --create-if-none`, which edits the last
# comment by github-actions[bot] on the PR) so superseded findings do not
# stack beside current ones. These are the Tier-1 review findings on the
# PR that introduced this file, all taken.
#
# The prompt interpolates only trusted, fixed-shape event fields (repository
# name, PR number, head and base SHAs). PR title, body, and comments are
# never interpolated into the prompt; the reviewer reads them through `gh`
# as data.
#
# Changes to this workflow's triggers, permissions, or steps require founder
# approval before merge (same rule class as DEC-20260718-02 clause 4).

name: Claude Code Review (advisory)

on:
  pull_request:
    types: [opened, synchronize]

# One live review per pull request: a newer push cancels a review still
# running on a superseded head, so a landed comment names the head it
# actually reviewed.
concurrency:
  group: claude-code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  claude-code-review:
    # Same-repository, human-authored pull requests only. GitHub withholds
    # repository secrets from fork and Dependabot pull requests, so the
    # action could neither authenticate nor post; skipping is explicit
    # rather than a failed run. (This private repository has no forks and
    # no Dependabot configuration at the time of writing.)
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@v4
        with:
          # The exact head commit, not the synthetic merge ref the event
          # checks out by default, so the tree the reviewer reads is the
          # HEAD SHA the prompt names.
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Advisory review
        # Pinned to the commit `v1` resolved to on 2026-09-01 (tag v1.0.212).
        # This step receives ANTHROPIC_API_KEY and a pull-requests:write
        # token; a movable tag could retarget that to unreviewed code.
        # Updating the pin is a workflow change and follows the founder-
        # approval rule in the header.
        uses: anthropics/claude-code-action@781d62e9d5fbd78b24dcdfd42858332d485fe462 # v1.0.212
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            HEAD SHA: ${{ github.event.pull_request.head.sha }}
            BASE SHA: ${{ github.event.pull_request.base.sha }}

            You are an ADVISORY reviewer for this pull request. Your output
            is one top-level comment, plus optional inline comments, for the
            author and the Founder to weigh. You are not a gate: nothing you
            write blocks, approves, or authorizes anything.

            The PR branch is already checked out in the current working
            directory. Use `gh pr view` for context and `gh pr diff` for the
            diff. Read files from the checkout as needed. Do not run build,
            test, install, or network commands.

            SCOPE — review the diff for exactly two things:

            1. Correctness against `docs/command-journal-contract.md`, read
               from the checked-out PR head. Where the diff implements,
               tests, documents, or cites the contract, check it against the
               contract's own clauses: the record contract and event-sourced
               row model, storage locus and sole writer, append-only and
               tamper evidence, command events and derived state and the
               fail-closed rule, secrets and normalization, planner lifecycle
               binding, Founder plan-decision authentication, citation basis,
               and the ruled terminal semantics. If the diff edits the
               contract itself, review the edit against the contract's
               authority-derivation preamble and its existing clauses. Name
               the clause number for every divergence you report.

            2. Repository conventions: AGENTS.md and README.md; the patterns
               already established under `packages/`, `test/`, `scripts/`,
               and `.github/workflows/`; commit and PR attribution trailers
               as AGENTS.md describes them; no secrets, tokens, or other
               credential material anywhere in the diff.

            OUT OF SCOPE — do not comment on: governance doctrine (it lives
            in FounderOS), whether the change is authorized, merge
            readiness, Tier-2 review, Founder authorization, product
            strategy, or style preferences not backed by an existing
            repository convention.

            OUTPUT RULES:

            - Deliver the review as exactly one top-level comment, updated
              in place across pushes: run
              `gh pr comment <PR NUMBER> --edit-last --create-if-none --body "..."`,
              which edits this workflow's previous advisory comment when one
              exists and otherwise creates it. Never post a second top-level
              comment. Its first line must be:
              Advisory review (non-blocking) — head <the HEAD SHA above>
              Then state the scope in one sentence, then list findings
              grouped as: Contract divergence / Convention divergence /
              Nit. For each finding give the file and line, the clause or
              convention it diverges from, and what you verified. If you
              find nothing in scope, say so explicitly in the comment.
            - Use `mcp__github_inline_comment__create_inline_comment`
              (with `confirmed: true`) only for findings tied to a specific
              changed line.
            - Only post GitHub comments - don't submit review text as
              messages.
            - Never emit lines beginning with `Tier2-Verdict:`,
              `Tier2-Head-Sha:`, `Tier2-Reviewer-Id:`, `Role-Id:`,
              `Actor-Id:`, or `Execution-Surface:`; those are governed
              markers reserved for humans and gates. Never write anything
              that reads as a verdict on merge readiness or as a merge
              authorization.
            - Do not edit files, create commits, push, approve, request
              changes, or submit a formal review.

          claude_args: |
            --max-turns 40
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
