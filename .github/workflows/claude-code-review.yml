# ADVISORY — Claude Code automated review of pull requests.
#
# Posts one advisory review comment on every pull request opened against, or
# pushed to, this repository. The review is scoped to two things only:
#   1. correctness of the diff against `docs/command-journal-contract.md`;
#   2. this repository's conventions (AGENTS.md, README.md, the existing
#      packages, tests, scripts, and workflows).
#
# ADVISORY ONLY — NEVER A REQUIRED CHECK. Founder ruling, recorded in the
# FounderOS decision log at v4.50: neither job below may be added to the
# `main` ruleset's required status checks. The comment is input for the
# author and the Founder to weigh. It is not a Tier-2 review under
# DEC-20260814-02, not a merge authorization under DEC-20260718-04, and a
# failed or skipped run blocks nothing.
#
# Two jobs, split so the model never holds a write channel and a secret at
# the same time (CodeRabbit finding on the PR that introduced this file):
#
#   review — runs Claude Code with the Founder's Claude Code OAuth token.
#     Its GITHUB_TOKEN is
#     READ-ONLY (contents: read, pull-requests: read); its only shell
#     commands are `gh pr view` and `gh pr diff`; it has no comment tool.
#     The review text leaves the job only as structured output.
#   post — no model, no credential. Holds pull-requests: write and publishes
#     the review deterministically: refuses text that matches an API-key
#     pattern or carries a governed marker line, prepends this workflow's
#     own marker, and edits the marker-bearing comment in place on later
#     pushes (or creates it), never touching another automation's comment.
#
# Authentication, stated so nothing is inferred:
#   - CLAUDE_CODE_OAUTH_TOKEN is Founder-provisioned as a repository
#     secret: the token `claude setup-token` issues for a Claude
#     subscription, chosen by the Founder on 2026-09-01 over an API key.
#     This file references it only as `secrets.CLAUDE_CODE_OAUTH_TOKEN`;
#     the value is never echoed, logged, or committed. If the secret is
#     absent the review job fails and, being non-required, blocks nothing.
#     Switching to an API key later is the one `with:` line below
#     (`anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}` in its place).
#   - GitHub access uses the workflow's own GITHUB_TOKEN, passed through the
#     action's `github_token` input and bounded by each job's `permissions`.
#     The action's default path instead exchanges an OIDC token for a
#     Claude GitHub App installation token, which requires that app to be
#     installed on this repository by a repository admin; supplying
#     `github_token` short-circuits that exchange (action source,
#     src/github/token.ts: OVERRIDE_GITHUB_TOKEN is returned before any OIDC
#     request), so no app installation is required for this workflow.
#     Comments therefore appear as github-actions[bot].
#
# Input names are taken from the action's `action.yml` and its
# docs/solutions.md "Automatic PR Code Review" example at
# anthropics/claude-code-action `main`, read 2026-09-01 — not from memory.
# Both third-party actions are pinned to the full commit SHA their tags
# resolved to on that date; fork and bot-authored pull requests are
# skipped by a guard on the PR author. The action's own
# `use_sticky_comment` is not used: at the pinned commit it locates the
# prior comment by the Claude app's bot id, a bot login containing
# "claude", or the untouched initial body, none of which hold on the
# built-in-token path. These are the Tier-1 review findings on the PR that
# introduced this file, all taken.
#
# The prompt interpolates only trusted, fixed-shape event fields
# (repository name, PR number, head and base SHAs). PR title, body, and
# comments are never interpolated into the prompt; the reviewer reads them
# through `gh` as data.
#
# Changes to this workflow's triggers, permissions, or steps require founder
# approval before merge (same rule class as DEC-20260718-02 clause 4).

name: Claude Code Review (advisory)

# `pull_request_target`, not `pull_request`: the workflow DEFINITION then
# comes from the trusted base branch, so a pull request cannot edit this
# file to loosen the reviewer's tool allowlist or move the credential into
# a write-capable job and have that edit run against the secret before any
# review. The PR is still reviewed at its exact head SHA (checked out
# below), never executed: the reviewer's shell is `gh pr view` and
# `gh pr diff` only, and the poster checks nothing out. Consequence: a PR
# that changes this file runs the base-branch version of it, so a
# workflow change is exercised only after it merges. (Copilot finding on
# the PR that introduced this file.)
on:
  pull_request_target:
    types: [opened, synchronize]

# One live review per pull request: a newer push cancels a review still
# running on a superseded head, so a landed comment names the head it
# actually reviewed.
concurrency:
  group: claude-code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  review:
    # Same-repository, human-authored pull requests only, gated on the PR
    # AUTHOR (not `github.actor`, which is whoever pushed the latest
    # commit). Under `pull_request_target` the credential would otherwise
    # be available to a fork or bot-authored pull request, so this guard
    # is the control, not a courtesy. (This private repository has no
    # forks and no Dependabot configuration at the time of writing.)
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.type == 'User'
    runs-on: ubuntu-latest
    # Read-only: the model holds the credential here, so it holds no write
    # capability anywhere. Publishing happens in `post`.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      structured: ${{ steps.review.outputs.structured_output }}
    steps:
      - name: Checkout pull request head
        # Pinned to the commit `v4` resolved to on 2026-09-01 (tag v4.4.0),
        # so no mutable tag selects code that runs with the workflow token.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The exact head commit, not the synthetic merge ref the event
          # checks out by default, so the tree the reviewer reads is the
          # HEAD SHA the prompt names.
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Advisory review (read-only)
        id: review
        # Pinned to the commit `v1` resolved to on 2026-09-01 (tag v1.0.212).
        # This step receives the OAuth token; a movable tag could retarget
        # that to unreviewed code. Updating the pin is a workflow change and
        # follows the founder-approval rule in the header.
        uses: anthropics/claude-code-action@781d62e9d5fbd78b24dcdfd42858332d485fe462 # v1.0.212
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # No inline comments are produced in this design, and the
          # post-run classification step requires an API key this workflow
          # does not hold, so it is switched off.
          classify_inline_comments: "false"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            HEAD SHA: ${{ github.event.pull_request.head.sha }}
            BASE SHA: ${{ github.event.pull_request.base.sha }}

            You are an ADVISORY reviewer for this pull request. Your review
            is delivered as the `review` field of your structured output;
            a separate, model-free step publishes it as one comment for the
            author and the Founder to weigh. You are not a gate: nothing
            you write blocks, approves, or authorizes anything. You cannot
            post comments yourself and must not try.

            The PR head is already checked out in the current working
            directory. Use `gh pr view` for context and `gh pr diff` for the
            diff. Read files from the checkout as needed. Do not run build,
            test, install, or network commands.

            SCOPE — review the diff for exactly two things:

            1. Correctness against `docs/command-journal-contract.md`, read
               from the checked-out PR head. Where the diff implements,
               tests, documents, or cites the contract, check it against the
               contract's own clauses: the record contract and event-sourced
               row model, storage locus and sole writer, append-only and
               tamper evidence, command events and derived state and the
               fail-closed rule, secrets and normalization, planner lifecycle
               binding, Founder plan-decision authentication, citation basis,
               and the ruled terminal semantics. If the diff edits the
               contract itself, review the edit against the contract's
               authority-derivation preamble and its existing clauses. Name
               the clause number for every divergence you report.

            2. Repository conventions: AGENTS.md and README.md; the patterns
               already established under `packages/`, `test/`, `scripts/`,
               and `.github/workflows/`; commit and PR attribution trailers
               as AGENTS.md describes them; no secrets, tokens, or other
               credential material anywhere in the diff.

            OUT OF SCOPE — do not comment on: governance doctrine (it lives
            in FounderOS), whether the change is authorized, merge
            readiness, Tier-2 review, Founder authorization, product
            strategy, or style preferences not backed by an existing
            repository convention.

            OUTPUT RULES for the `review` field (Markdown):

            - Begin with one sentence stating the scope you reviewed, then
              list findings grouped as: Contract divergence / Convention
              divergence / Nit. For each finding give the file and line,
              the clause or convention it diverges from, and what you
              verified. If you find nothing in scope, say so explicitly.
            - Never include lines beginning with `Tier2-Verdict:`,
              `Tier2-Head-Sha:`, `Tier2-Reviewer-Id:`, `Role-Id:`,
              `Actor-Id:`, or `Execution-Surface:`; those are governed
              markers reserved for humans and gates, and the publishing
              step refuses text that carries them. Never write anything
              that reads as a verdict on merge readiness or as a merge
              authorization.
            - Never reproduce credential material of any kind, including
              anything from your own environment; the publishing step
              refuses text that matches a key pattern.
            - Do not edit files, create commits, push, approve, request
              changes, or submit a formal review.

          # `claude_args` is a block scalar handed to the action's own
          # argument parser, not to YAML — so it carries arguments only, and
          # the note below sits outside it as a real YAML comment.
          #
          # --max-turns is 80, raised from 40 on 2026-09-15. The cap was hit
          # on three consecutive heads of PR #48 — 44, then 48, then 49 turns
          # — and in each case the review itself SUCCEEDED and the action
          # failed the job on turn count alone ("subtype": "success",
          # "is_error": false, then `Claude reported a successful result
          # after N turns, exceeding the configured maximum of 40`). The
          # action exiting non-zero skips the `post` job, so the completed
          # review is discarded and no comment is posted: the cost of the cap
          # is a lost review, not a bounded one.
          #
          # Turn usage scales with how much of a diff must be verified rather
          # than read, so hash-dense governance records under
          # `docs/planning/command-journal/custody/` will keep exceeding a low
          # cap however correct they are. The highest count observed was 49,
          # so 80 is about 1.6x it — a bound still, not a removal of the
          # bound: a runaway review still terminates, and the cap remains the
          # only ceiling on its cost.
          #
          # This raises the cliff, it does not remove it. The lossiness is
          # structural: a successful review is discarded because the action
          # exits non-zero on turn count and `post` is skipped, and that is
          # still true at 81 turns. The durable fix is to persist the review
          # output before the turn-count check — an artifact, or `if:
          # always()` on the consuming job. That is left as follow-up on
          # grounds of SCOPE, not of the approval gate: raising --max-turns
          # edits this same founder-approval-gated file, so the gate cannot be
          # the reason for deferring one and not the other.
          claude_args: |
            --max-turns 80
            --allowedTools "Bash(gh pr view:*),Bash(gh pr diff:*)"
            --json-schema '{"type":"object","properties":{"review":{"type":"string"}},"required":["review"]}'

  post:
    needs: review
    if: needs.review.result == 'success' && needs.review.outputs.structured != ''
    runs-on: ubuntu-latest
    # The only job with a write capability; it runs no model and holds no
    # credential.
    permissions:
      pull-requests: write
    steps:
      - name: Publish the advisory comment (create or edit in place)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # Untrusted model output: reaches the scripts below only through
          # this environment variable, never shell interpolation.
          STRUCTURED: ${{ needs.review.outputs.structured }}
          MARKER: "<!-- claude-code-review-advisory -->"
        run: |
          set -euo pipefail
          payload_file="$RUNNER_TEMP/advisory-review.json"

          # Extract, then refuse rather than sanitize: a credential-shaped
          # token or a governed marker line means the text is not published
          # at all. The comment body is emitted as a JSON payload so the API
          # call carries it verbatim, with no field coercion or file-magic.
          python3 - "$payload_file" <<'PY'
          import json, os, re, sys
          out = sys.argv[1]
          try:
              text = json.loads(os.environ["STRUCTURED"]).get("review", "")
          except (ValueError, KeyError) as e:
              print(f"refusing to post: structured output unreadable ({e})", file=sys.stderr)
              sys.exit(2)
          if not isinstance(text, str) or not text.strip():
              print("refusing to post: review text is empty", file=sys.stderr)
              sys.exit(2)
          # High-confidence credential shapes: Anthropic API keys, and the
          # GitHub token families (classic, fine-grained, OAuth, app
          # installation, refresh, user-to-server). One policy, applied
          # before anything is written.
          credential_shapes = [
              r"sk-ant-[A-Za-z0-9_-]{16,}",
              r"github_pat_[A-Za-z0-9_]{22,}",
              r"gh[pousr]_[A-Za-z0-9]{36,}",
          ]
          if any(re.search(shape, text) for shape in credential_shapes):
              print("refusing to post: text matches a credential pattern", file=sys.stderr)
              sys.exit(3)
          if re.search(r"^(Tier2-Verdict|Tier2-Head-Sha|Tier2-Reviewer-Id|Role-Id|Actor-Id|Execution-Surface):", text, re.M):
              print("refusing to post: text carries a governed marker line", file=sys.stderr)
              sys.exit(4)
          marker = os.environ["MARKER"]
          head = os.environ["HEAD_SHA"]
          run_url = os.environ["RUN_URL"]
          body = (
              f"{marker}\n"
              f"Advisory review (non-blocking) — head {head}\n\n"
              f"{text.rstrip()}\n\n"
              "<sub>Advisory only: not a Tier-2 verdict, not a merge "
              f"authorization, never a required check. Run: {run_url}</sub>\n"
          )
          with open(out, "w", encoding="utf-8") as f:
              json.dump({"body": body}, f)
          PY

          # This workflow's own comment is the github-actions[bot] comment
          # that begins with the marker; any other automation's comment is
          # left alone. Edit in place if found, otherwise create.
          existing="$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate \
            --jq "[.[] | select(.user.login == \"github-actions[bot]\") | select(.body | startswith(\"$MARKER\"))] | first | .id // empty")"
          if [[ -n "$existing" ]]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$existing" --input "$payload_file" > /dev/null
            echo "advisory comment $existing updated for head $HEAD_SHA"
          else
            gh api --method POST "repos/$REPO/issues/$PR_NUMBER/comments" --input "$payload_file" > /dev/null
            echo "advisory comment created for head $HEAD_SHA"
          fi
