# ACTIVE — authorized by DEC-20260718-02 (Path-Audit CI Gate Activation),
# ruled active by the founder 2026-07-18. Proposed under DEC-20260718-01
# clause 6 as path-audit.yml.proposed; activated by rename per
# DEC-20260718-02 clause 2.
#
# On pull requests that touch doctrine files (any Markdown in the
# repository — the audit surface and everything it references are .md),
# run the deterministic path audit adopted by DEC-20260718-01. No LLM,
# no network beyond checkout, no secrets, read-only. Changes to this
# workflow's triggers, permissions, or steps require founder approval
# before merge (DEC-20260718-02 clause 4).

name: Path Audit

on:
  pull_request:
    paths:
      - '**.md'

permissions:
  contents: read

jobs:
  path-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run deterministic path audit
        run: bash 00-system/scripts/path-audit.sh
