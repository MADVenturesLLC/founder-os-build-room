# ACTIVE — adopted for this repository by DEC-20260815-18 clause 1, which makes
# path-audit a required check here alongside attribution-shape.
#
# Adapted from FounderOS `.github/workflows/path-audit.yml`, with ONE deliberate
# difference in the trigger. FounderOS filters on `**.md`, because there the
# audit surface AND everything it references are Markdown. Here the audit
# surface is Markdown but the paths it references are CODE — so a commit that
# deletes or moves `packages/ledger` without touching a `.md` file would break a
# documented reference and, under the `**.md` filter, never run the audit. This
# workflow therefore runs on every pull request, and on push to `main`.
#
# Changes to this workflow's triggers, permissions, or steps require founder
# approval before merge (DEC-20260718-02 clause 4).

name: Path Audit

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  path-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Run deterministic path audit
        run: bash scripts/path-audit.sh
