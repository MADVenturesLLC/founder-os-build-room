# FOUNDER AUTHORIZATION — the merge guard.
#
# WHAT IT IS. Publishes a commit status named `founder-authorization` on a
# pull request's current head: `success` only when a PR comment from an
# allowed login opens with the SHA-named authorization DEC-20260718-04
# requires ("Authorized: merge <owner>/<repo>#<n> at head <40-hex SHA>")
# naming that exact head; `failure` otherwise. The decision itself lives in
# scripts/founder-authorization-check.sh, which the repository's unit suite
# tests (test/founder-authorization.test.ts).
#
# WHY. On 2026-09-27 PRs #76, #80 and #81 were merged with no authorization
# on the PR. The Founder approved building this guard the same day ("yes,
# build the merge guard").
#
# IT ONLY GUARDS ONCE IT IS REQUIRED. Making `founder-authorization` a
# required status check on `main` is a repository security-posture change
# reserved to the Founder (AGENTS.md approval gates). This file does not do
# that. Until the Founder does, the status is advisory.
#
# WHAT IT CANNOT PROVE. Founder and agent sessions comment through the same
# GitHub account, so the status proves which account wrote the comment, not
# which person or session. And GitHub does not bind a status context or a
# check name to this workflow: a pull request from a branch in this
# repository could add its own workflow that posts `founder-authorization`
# as success. Both are deliberate circumvention, visible in the diff (a
# workflow change the Founder reviews), not accidents. This guard stops
# accidental merges; the rule that only the Founder posts authorizations
# still carries the rest. Binding the status to this workflow alone needs a
# dedicated GitHub App whose key only a main-restricted environment can
# read, a Founder provisioning act this file does not perform.
#
# FAILS CLOSED. Once the head is known, any step that cannot complete, and
# any run interrupted by SIGINT or SIGTERM, publishes `failure`, so an
# earlier `success` on the head never outlives an evaluation that did not
# finish. Runs for one PR queue rather than cancel each other. A commit
# status belongs to a SHA, not a PR, so a head shared with another open PR
# is refused rather than judged.
#
# UNTRUSTED INPUT. pull_request_target and issue_comment run with a token
# that can write statuses, so this workflow never checks out or executes PR
# code: it checks out the default branch only, and PR comments reach the
# decision script as JSON on stdin, read by jq, never by the shell. No
# `${{ }}` expression appears inside a run: script; event values reach the
# shell through env mappings only.
#
# Changes to this workflow's triggers, permissions, or steps require founder
# approval before merge (same rule class as DEC-20260718-02 clause 4).

name: Founder Authorization

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  issue_comment:
    types: [created, edited, deleted]

permissions:
  contents: read
  statuses: write
  pull-requests: read
  issues: read

# Runs for one PR queue instead of cancelling each other, so an evaluation
# is never killed mid-flight by the next one; the last queued run always
# completes and publishes the final verdict. (Tier-2 review, 2026-09-27.)
concurrency:
  group: founder-authorization-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  evaluate:
    # issue_comment fires for issues too; only PR comments are judged.
    if: github.event_name == 'pull_request_target' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    steps:
      # The default branch, never the PR head: the gate that judges a PR must
      # not be something the PR can change.
      - name: Checkout the default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Judge the current head and publish the status
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          FOUNDER_LOGINS: decivantiq
        run: |
          set -euo pipefail
          api() {
            curl -fsS \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$@"
          }
          publish() {
            # $1 state, $2 description
            local payload
            payload="$(jq -nc --arg s "$1" --arg d "$2" \
              '{state: $s, context: "founder-authorization", description: ($d | .[0:140])}')"
            api -X POST "https://api.github.com/repos/$REPO/statuses/$head_sha" -d "$payload" >/dev/null
            echo "founder-authorization: $1 on $head_sha ($2)"
          }
          head_sha="$(api "https://api.github.com/repos/$REPO/pulls/$PR_NUMBER" | jq -er '.head.sha')"
          # From here on, any step that fails publishes failure before the job
          # ends, so an earlier success on this head can never outlive an
          # evaluation that could not complete.
          trap 'trap - ERR INT TERM; publish failure "Evaluation did not complete; re-run to judge this head" || true' ERR
          # A run cancelled by hand, or stopped with its runner, gets SIGINT
          # or SIGTERM rather than an error; it publishes failure too.
          trap 'trap - ERR INT TERM; publish failure "Evaluation was interrupted; re-run to judge this head" || true; exit 1' INT TERM

          # A commit status belongs to a SHA, not a PR. If another open PR
          # shares this head, a success here would show on that PR too, so a
          # shared head is refused outright.
          open_prs='[]'
          page=1
          while :; do
            batch="$(api "https://api.github.com/repos/$REPO/pulls?state=open&per_page=100&page=$page")"
            open_prs="$(jq -c --argjson acc "$open_prs" '$acc + .' <<<"$batch")"
            if [[ "$(jq 'length' <<<"$batch")" -lt 100 ]]; then break; fi
            page=$((page + 1))
          done
          sharing="$(jq -r --arg h "$head_sha" --argjson n "$PR_NUMBER" \
            '[.[] | select(.head.sha == $h and .number != $n) | "#\(.number)"] | join(" ")' <<<"$open_prs")"
          if [[ -n "$sharing" ]]; then
            trap - ERR INT TERM
            publish failure "Head ${head_sha:0:7} is shared with open PR $sharing; refused"
            exit 1
          fi

          comments='[]'
          page=1
          while :; do
            batch="$(api "https://api.github.com/repos/$REPO/issues/$PR_NUMBER/comments?per_page=100&page=$page")"
            comments="$(jq -c --argjson acc "$comments" '$acc + .' <<<"$batch")"
            if [[ "$(jq 'length' <<<"$batch")" -lt 100 ]]; then break; fi
            page=$((page + 1))
          done
          if verdict="$(bash scripts/founder-authorization-check.sh "$REPO" "$PR_NUMBER" "$head_sha" <<<"$comments")"; then
            state=success
          else
            state=failure
          fi
          description="$(jq -r '.description' <<<"$verdict")"
          trap - ERR INT TERM
          publish "$state" "$description"
          # The job's own check run mirrors the status, so either can be the
          # required check and neither stays green on an unauthorized head.
          [[ "$state" == success ]]
