# CI baseline for the Build Room.
#
# Stands up the WF-17 step 4 baseline that `DEC-20260815-01` clause 3 requires
# this repository to be onboarded against: locked install, typecheck, tests.
#
# Lint and dependency audit are configured, in the `hygiene` job below, which
# is deliberately NOT a required branch-protection check (adding a required
# check is a repository security-posture change reserved to the Founder):
# lint runs and is advisory (continue-on-error) while pre-existing findings
# remain untriaged; secret scanning runs and is blocking within the `hygiene`
# job; npm audit runs and is advisory/non-blocking evidence (`|| true`).
# WF-17 Founder sign-off (control step 8) remains incomplete, and the
# `hygiene` job does not satisfy it.
#
# CI runs credential-free. The unit suite covers pure packages and stubbed
# I/O; the integration job below runs the storage suite against a Postgres
# service container, so it needs no provider account and no secret — the
# throwaway database lives and dies with the job.

name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Use Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      - name: Locked install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test (acceptance-criteria suite)
        run: npm test

      - name: Path audit
        run: npm run gate:path-audit

      - name: Attribution checker self-test
        run: npm run gate:attribution-selftest

      # The contract integrity gate (C12) is deliberately NOT a CI step. It
      # scans the authorizing contract DOCUMENT, which lives outside this
      # repository and is not a tracked file — a CI job has nothing to point it
      # at. It runs pre-PR via `npm run gate:integrity <contract-path>`, and its
      # result and the artifact's SHA-256 are recorded in the PR body.
      - name: Verify-check (unverified checks count as failing)
        run: npm run gate:verify-check

  # The storage suite skips itself when TEST_DATABASE_URL is unset, which is the
  # right default locally and the wrong one in CI: coverage that depends on
  # someone remembering to export a variable is coverage that quietly lapses.
  # This job supplies the database so the suite always runs.
  storage-integration:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: buildroom_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Use Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      - name: Locked install
        run: npm ci

      # `npm run test:storage` rather than `npm test`, and the difference is not
      # cosmetic: the storage command refuses to start without
      # TEST_DATABASE_URL, so this job can no longer report success by skipping
      # everything it exists to run. `npm test` keeps its own behaviour and
      # still runs the storage cases (which self-skip) in the credential-free
      # job above.
      - name: Test (storage suite against Postgres)
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/buildroom_test
        run: npm run test:storage

      # The suite is designed to be re-runnable against a database that
      # already holds a previous run's rows. It was not, at first: room ids
      # came from a per-process counter, so a second run collided with the
      # first and six assertions failed. Running it twice is what caught that,
      # so CI runs it twice.
      - name: Test again (proves the suite is re-runnable, not virgin-only)
        env:
          TEST_DATABASE_URL: postgresql://postgres:***@127.0.0.1:5432/buildroom_test
        run: npm run test:storage

  # WF-17 hygiene: lint, secret scanning (AUTHORIZED), and advisory npm audit
  # (AUTHORIZED AS ADVISORY ONLY). This job is deliberately separate from
  # build-and-test and storage-integration so neither of those required
  # checks' names or behavior change, and this job is NOT added to the
  # branch ruleset's required-status-checks list — adding a required check
  # is a repository security-posture change reserved to the Founder
  # (AGENTS.md "Approval gates").
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for the secret scan)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Use Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      - name: Locked install
        run: npm ci

      # Lint (WF-17: AUTHORIZED). Non-blocking for now: the initial config
      # surfaced 27 pre-existing findings across files outside this task's
      # authorized scope (no unrelated cleanup), so failing the job on them
      # would treat unrelated legacy debt as a new regression. Reported as
      # evidence in the job log; making this blocking is a follow-up act
      # once those findings are triaged and closed on their own PR.
      - name: Lint (advisory until pre-existing findings are triaged)
        run: npm run lint
        continue-on-error: true

      # Secret scanning (WF-17: AUTHORIZED). Blocking within this job: a
      # genuine finding is a real problem, not something to wave through.
      # Not added to the branch ruleset's required checks (see job header).
      - name: Secret scan (gitleaks, redacted output)
        run: npm run gate:secret-scan

      # npm audit (WF-17: AUTHORIZED AS ADVISORY ONLY). Never fails the
      # job — `|| true` after capturing output, so this can never become a
      # required merge gate by construction, and a vulnerability here can
      # never block CI or trigger an automatic upgrade.
      - name: npm audit (advisory only — never blocks)
        run: npm audit || true
